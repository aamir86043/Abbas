<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1633">
  <title>Saathi AI - Testing Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true">S</div>
      <div><h1>Testing Panel</h1><p class="tagline">Real results, never a default pass</p></div></div>
  </header>
  <div class="disclaimer" role="note">Each test shows only what the browser actually returned. Physical things like sound and vibration must be confirmed by you.</div>
  <main>
    <section class="card" id="tests" aria-label="Tests"></section>
    <div class="row"><button id="runAll" class="btn">Run all tests (except BLE)</button></div>
    <p class="footer-link"><a href="index.html">Back to dashboard</a></p>
  </main>
  <script type="module" src="js/tests.js"></script>
</body>
